name: Ruflo source catalog integrity

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/ruflo/**'
      - 'scripts/ruflo-skills-sync.mjs'
      - 'scripts/verify-ruflo-catalog.mjs'
      - '.github/workflows/ruflo-catalog-integrity.yml'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'vendor/ruflo/**'
      - 'scripts/ruflo-skills-sync.mjs'
      - 'scripts/verify-ruflo-catalog.mjs'
      - '.github/workflows/ruflo-catalog-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Validate submodule gitlink without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD vendor/ruflo/upstream | awk '{print $3}')" = '87f612cef121b50c2e31e2d3f88e46d88963a377'
      - name: Validate integrity scripts
        run: |
          node --check scripts/ruflo-skills-sync.mjs
          node --check scripts/verify-ruflo-catalog.mjs
      - name: Validate all indexed source hashes and plugin groupings
        run: node scripts/verify-ruflo-catalog.mjs
      - name: Prove full importer is a passive dry run by default
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ruflo-skills-sync.mjs > /tmp/ruflo-preview.txt
          grep -F 'Scope=all, files=419, apply=false' /tmp/ruflo-preview.txt
          test "$(wc -l < /tmp/ruflo-preview.txt)" -eq 420
